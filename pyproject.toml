[project]
name = "kaupamex-api"
version = "0.1.0"
description = "Kaupamex — API REST (Django + DRF)"
requires-python = ">=3.12,<3.15"
authors = [
    {name = "Equipo Kaupamex", email = "dev@kaupamex.com"}
]
license = {text = "Confidential"}

# Fuente unica de verdad de las dependencias del API. uv.lock congela el
# grafo para reproducibilidad.
# Para actualizar una version: cambiarla aqui, `uv lock --upgrade-package X`,
# validar y commitear el nuevo lock. D-031/H-14: uv en todos los submodulos.
dependencies = [
    # Core Django + DRF
    "Django==6.0.5",
    "djangorestframework==3.16.1",
    "djangorestframework-simplejwt==5.5.1",
    "drf-spectacular==0.29.0",
    # Configuracion (.env tolerante a sin-comillas; ver diagnostico-env)
    "python-decouple==3.8",
    # Base de datos — PostgreSQL, el motor de la referencia (iniciativa
    # migrar-motor-mariadb-a-postgresql). psycopg 3 es el driver que Django 6
    # prefiere; el 2 sigue soportado pero es el camino de salida.
    "psycopg[binary]>=3.2",
    "certifi>=2024.0.0",
    # Imagenes / media
    "Pillow>=10.3.0",
    # Seguridad
    "cryptography>=42.0.0",
    # Passkeys / WebAuthn (addons.authz_passkey). La referencia VENDORIZA esta
    # libreria en auth_passkey/_vendor/webauthn (4537 loc); aqui se declara como
    # dependencia porque el proyecto tiene uv + lock y copiarla seria peor
    # (sin CVEs, sin upgrades). Ver H-API-228.
    "webauthn>=2.8.0",
    # HTTP saliente (addons.authz_oauth valida access_tokens contra el
    # proveedor). Ya llegaba transitivo via mercadopago; se declara directo
    # porque ahora hay imports propios (uv no garantiza transitivas).
    "requests>=2.31.0",
    # Pagos
    "mercadopago>=2.2.0",
    # CORS
    "django-cors-headers==4.9.0",
    "xlsxwriter>=3.2.9",
    # Servidor de aplicacion WSGI embebido (ADR-027). Es dependencia de
    # PRODUCCION a proposito: el producto L0 se distribuye a terceros y debe
    # servir HTTP por si mismo, sin asumir Apache+mod_wsgi en el destino. La
    # referencia publica su propia invocacion de Gunicorn en
    # odoo19c: setup/odoo-wsgi.example.py (odoo-tools@622ddc2a).
    "gunicorn>=23.0.0",
    "lxml>=6.1.1",
    # Aritmetica de calendario para el cargador de datos XML: el contexto de
    # evaluacion de `tools/convert.py` expone `relativedelta` a las expresiones
    # de un archivo de datos, tal cual la referencia
    # (odoo19c: odoo/tools/convert.py:20). Ni stdlib ni Django lo traen —
    # `timedelta` no sabe de meses ni de anios.
    "python-dateutil>=2.9.0",
    "paramiko>=3.4.0",
    "passlib>=1.7.4",
    # Formateo de fecha/hora sensible a la localizacion. Lo importa la
    # referencia y lo consume `ir.actions.server.history._compute_display_name`
    # (odoo19c: odoo/addons/base/models/ir_actions.py:519-524), que etiqueta
    # cada revision con la fecha en el idioma del lector. Ni stdlib ni Django
    # dan `format_datetime(locale=...)`: `django.utils.formats` formatea con el
    # idioma ACTIVO del proceso, no con uno pedido por argumento.
    "babel>=2.14.0",
    # Escapado seguro de HTML. Lo importa la referencia en
    # `odoo/tools/json.py:8` para que `scriptsafe.dumps` devuelva una cadena
    # que sabe escaparse al incrustarse en una plantilla (`__html__`). Es la
    # dependencia de Jinja2/Flask, no de Werkzeug: no entra en la exclusion
    # del stack (usamos gunicorn, no Werkzeug).
    "markupsafe>=2.1.0",
]

[project.optional-dependencies]
# Federacion LDAP (addons.authz_ldap). OPCIONAL a proposito: la referencia
# tambien la declara asi —auth_ldap/__manifest__.py:
# external_dependencies={'python': ['python-ldap'], 'apt': {...: 'python3-ldap'}}—
# porque python-ldap compila contra libldap/libsasl del sistema. Sin el paquete
# apt (libldap2-dev libsasl2-dev) la rueda NO compila. El addon carga igual y
# degrada: LDAP_AVAILABLE=False y todo intento de autenticar levanta un error
# explicito. Instalar con:  uv sync --extra ldap
ldap = [
    "python-ldap>=3.4.0",
]

[dependency-groups]
# Tres estados de instalacion (PEP 735), una sola fuente de verdad:
#   produccion : `uv sync --no-dev`                       -> solo [project].dependencies
#   test (CI)  : `uv sync --no-default-groups --group test` -> base + runners de prueba
#   desarrollo : `uv sync`                                 -> base + dev (dev incluye test + tooling)
# Nota: `--only-group test` NO sirve para CI: excluye las deps base
# (Django, DRF, mysqlclient) y la suite no arrancaria.
test = [
    "pytest==7.4.4",
    "pytest-django==4.7.0",
    "factory-boy==3.3.0",
    # Reparto por proceso, con una base por worker. pytest-django lo resuelve
    # en django_db_modify_db_settings_xdist_suffix: sufija TEST.NAME con el
    # workerid, asi que la base compartida nunca se toca. Medido 2.54x con
    # cuatro workers en cuatro CPUs, equilibrio en la tercera ejecucion sobre
    # las mismas bases. Ver H-API-804.
    "pytest-xdist==3.6.1",
]
dev = [
    # Herramientas de desarrollo (shell_plus, graph_models, etc.) + todo test.
    "django-extensions==3.2.3",
    {include-group = "test"},
]

[tool.uv]
# native-tls: usa el store de certificados nativo del sistema operativo
# (rustls-native-certs) en vez del bundle propio de uv. Campo válido de uv;
# reemplaza al inexistente `system-certs`, que uv ignoraba emitiendo
# "unknown field `system-certs`" en cada `uv run`. Equivale a UV_NATIVE_TLS=1.
native-tls = true
# package = false: el API es una aplicacion Django (codigo bajo
# src/), no un paquete distribuible. uv gestiona el entorno y
# las dependencias pero NO intenta construir el proyecto como wheel.
package = false
