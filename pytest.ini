[pytest]
DJANGO_SETTINGS_MODULE = config.settings.testing
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# D-031 H-19: rootdir == api/ pero el codigo Django vive en
# src/. Sin estos dos settings, 'pytest' desde la raiz
# del repo fallaba con:
#   ImportError: No module named 'config'
#   pytest-django could not find a Django project (no manage.py)
# Y desde src/ coleccionaba 0 items porque tests/ esta
# al nivel del repo, no dentro de src/.
# Reportado por deploy@yollotl.
#
# pythonpath: agrega src/ a sys.path para que
#   'config.settings.testing' sea importable desde cualquier CWD.
# testpaths: limita la coleccion a tests/ (al lado de src/,
#   no dentro). Evita escanear .venv, node_modules, etc.
pythonpath = src
testpaths = tests
# -p no:randomly: el plugin pytest-randomly genera deadlocks
# intermitentes (MySQLdb.OperationalError 1213) al reordenar tests
# que comparten transacciones cart/checkout/payments con
# fixtures session-scoped + transaction=True. Mantener orden
# determinista es la decision canonica (D-017).
# Ref: kaupamex-api/docs/hallazgos/2026-05-19-orders-admin-cluster.md
# D-031 H-21 (reportado deploy@yollotl): testing.py declara
# TEST.NAME=kaupamex_core_qa, asi que Django intenta DROP+CREATE de
# kaupamex_core_qa en cada run de pytest. Sin GRANT DROP/CREATE
# globales a django_user, la operacion se cuelga indefinidamente
# (1007 "exists" en CREATE + DROP hang). --reuse-db evita el ciclo:
# si la BD existe, pytest la reutiliza (migraciones se aplican si
# son nuevas). Para forzar recreacion: pytest --create-db.
addopts =
    --strict-markers
    --tb=short
    -p no:randomly
    --reuse-db
# El resumen de avisos sólo sirve si un aviso NUEVO destaca. Medido sobre la
# suite completa había DOS avisos distintos, y los dos se resolvieron aquí:
#
#   1. django/test/utils.py — "Overriding setting DATABASES can lead to
#      unexpected behavior", en los 6 casos de tests/unit/orm/test_multidb_
#      router.py y test_router_failclosed.py. Se filtró EN ESOS DOS MÓDULOS,
#      no aquí, porque el peligro que Django nombra es real en general y sólo
#      no aplica ahí (el router es lógica pura, no abre conexión).
#
#   2. passlib/utils/__init__.py:854 — "'crypt' is deprecated and slated for
#      removal in Python 3.13". Es de la dependencia y no se puede corregir en
#      su fuente. Su consecuencia SÍ se midió: passlib envuelve el import en
#      try/except y degrada a has_crypt=False; los dos esquemas que declara
#      _crypt_context (pbkdf2_sha512, plaintext) son de Python puro y ninguno
#      declara backends, así que ninguno llega a safe_crypt. El control que lo
#      mantiene honesto vive en tests/unit/base/test_crypt_context.py
#      (TestWithoutTheCryptOfTheOperatingSystem): cifra y verifica con el crypt
#      del sistema anulado. Si algún día se adopta un esquema respaldado por
#      os_crypt, ese control se pone rojo — el filtro de abajo no lo esconde.
#
# El filtro va acotado a su mensaje: NO es un "ignore" general.
filterwarnings =
    ignore:'crypt' is deprecated and slated for removal:DeprecationWarning

markers =
    unit: Tests unitarios de modelos y servicios
    integration: Tests de flujos completos end-to-end
    api: Tests de contrato de API
    schema: Tests de cobertura OpenAPI Sprint 4 (T-001..T-008)
