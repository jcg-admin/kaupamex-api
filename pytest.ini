[pytest]
DJANGO_SETTINGS_MODULE = config.settings.testing
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# D-031 H-19: rootdir == api/ pero el codigo Django vive en
# practicayoruba/. Sin estos dos settings, 'pytest' desde la raiz
# del repo fallaba con:
#   ImportError: No module named 'config'
#   pytest-django could not find a Django project (no manage.py)
# Y desde practicayoruba/ coleccionaba 0 items porque tests/ esta
# al nivel del repo, no dentro de practicayoruba/.
# Reportado por deploy@yollotl.
#
# pythonpath: agrega practicayoruba/ a sys.path para que
#   'config.settings.testing' sea importable desde cualquier CWD.
# testpaths: limita la coleccion a tests/ (al lado de practicayoruba/,
#   no dentro). Evita escanear .venv, node_modules, etc.
pythonpath = practicayoruba
testpaths = tests
# -p no:randomly: el plugin pytest-randomly genera deadlocks
# intermitentes (MySQLdb.OperationalError 1213) al reordenar tests
# que comparten transacciones cart/checkout/payments con
# fixtures session-scoped + transaction=True. Mantener orden
# determinista es la decision canonica (D-017).
# Ref: e-comerce-api/docs/hallazgos/2026-05-19-orders-admin-cluster.md
addopts =
    --strict-markers
    --tb=short
    -p no:randomly
markers =
    unit: Tests unitarios de modelos y servicios
    integration: Tests de flujos completos end-to-end
    api: Tests de contrato de API
