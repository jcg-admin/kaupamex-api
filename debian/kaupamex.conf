# Configuracion del producto L0 — vive en /etc/kaupamex/, fuera del arbol de
# codigo, como `odoo19c: debian/odoo.conf` la pone en /etc/odoo/.
#
# DIVERGENCIA DECLARADA DE FORMATO — la referencia usa un .ini con seccion
# `[options]` porque su lector es configparser (`odoo/tools/config.py`). El
# nuestro es `python-decouple` leyendo un archivo de pares KEY=value
# (`config/settings/base.py:281`), que es tambien lo que systemd admite en
# `EnvironmentFile=`. Un .ini con seccion NO lo parsea systemd, asi que copiar
# la forma de la referencia romperia la unidad.
#
# El instalador ajusta estos valores. La contrasena NO se deja aqui en claro
# en una instalacion real: el archivo nace con permiso 0640 y dueno kaupamex
# (ver postinst).

DJANGO_SETTINGS_MODULE=config.settings.production
DB_ENGINE=django.db.backends.postgresql
DB_NAME=kaupamex_core
DB_USER=django_user
DB_PASSWORD=
# En libpq el socket ES el HOST: un HOST que empieza con `/` designa el
# DIRECTORIO del socket y PORT nombra el archivo dentro de el.
DB_HOST=/var/run/postgresql
DB_PORT=5432
