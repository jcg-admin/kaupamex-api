components:
  schemas:
    Address:
      type: object
      description: 'UC-AUTH-07: Serializer de direccion de envio.'
      properties:
        id:
          type: integer
          readOnly: true
        alias:
          type: string
          title: Nombre de la direccion
          description: 'Ej: Casa, Trabajo, Almacen.'
          maxLength: 50
        recipient_name:
          type: string
          title: Nombre del destinatario
          maxLength: 150
        street:
          type: string
          title: Calle y numero
          maxLength: 200
        exterior_number:
          type: string
          title: Numero exterior
          description: 'Numero exterior (MX). Ej: 123, 45-B.'
          maxLength: 20
        interior_number:
          type: string
          title: Numero interior
          description: 'Numero interior si aplica (MX). Ej: Depto 5.'
          maxLength: 20
        neighborhood:
          type: string
          title: Colonia
          description: Colonia / neighborhood (MX).
          maxLength: 120
        city:
          type: string
          title: Ciudad
          maxLength: 100
        state:
          type: string
          title: Estado
          maxLength: 100
        zip_code:
          type: string
          title: Codigo postal
          maxLength: 10
        country:
          type: string
          title: Pais
          description: Codigo ISO 3166-1 alpha-2.
          maxLength: 2
        phone:
          type: string
          title: Telefono del destinatario
          maxLength: 20
        is_default:
          type: boolean
          title: Direccion predeterminada
      required:
      - alias
      - city
      - id
      - phone
      - recipient_name
      - state
      - street
      - zip_code
    AddressRequest:
      type: object
      description: 'UC-AUTH-07: Serializer de direccion de envio.'
      properties:
        alias:
          type: string
          minLength: 1
          title: Nombre de la direccion
          description: 'Ej: Casa, Trabajo, Almacen.'
          maxLength: 50
        recipient_name:
          type: string
          minLength: 1
          title: Nombre del destinatario
          maxLength: 150
        street:
          type: string
          minLength: 1
          title: Calle y numero
          maxLength: 200
        exterior_number:
          type: string
          title: Numero exterior
          description: 'Numero exterior (MX). Ej: 123, 45-B.'
          maxLength: 20
        interior_number:
          type: string
          title: Numero interior
          description: 'Numero interior si aplica (MX). Ej: Depto 5.'
          maxLength: 20
        neighborhood:
          type: string
          title: Colonia
          description: Colonia / neighborhood (MX).
          maxLength: 120
        city:
          type: string
          minLength: 1
          title: Ciudad
          maxLength: 100
        state:
          type: string
          minLength: 1
          title: Estado
          maxLength: 100
        zip_code:
          type: string
          minLength: 1
          title: Codigo postal
          maxLength: 10
        country:
          type: string
          minLength: 1
          title: Pais
          description: Codigo ISO 3166-1 alpha-2.
          maxLength: 2
        phone:
          type: string
          minLength: 1
          title: Telefono del destinatario
          maxLength: 20
        is_default:
          type: boolean
          title: Direccion predeterminada
      required:
      - alias
      - city
      - phone
      - recipient_name
      - state
      - street
      - zip_code
    AdminCreateUserRequest:
      type: object
      description: 'UC-AUTH-15: crear usuario administrador.'
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 150
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 8
      required:
      - email
      - password
      - username
    AdminOrder:
      type: object
      description: |-
        UC-ORD-09 (DEC-AOQ-02): subclass para vistas admin que expone
        user_email + user_username derivados del FK. La UI admin antes
        consumia ``order.user?.email`` -> undefined porque ``user`` era
        PK entero. Reuso del patron de AdminReturnListSerializer (returns)
        sin tocar OrderSerializer base usado por endpoints buyer.

        H-CICLO101-API-01: agrega status_logs para que el panel admin
        muestre el historial de transiciones de estado de la orden.
      properties:
        order_number:
          type: string
          maxLength: 20
        status:
          $ref: '#/components/schemas/OrderStatusEnum'
        status_display:
          type: string
          readOnly: true
        user:
          type: integer
          nullable: true
        guest_email:
          type: string
          format: email
          nullable: true
          description: Email del comprador invitado (BR-011).
          maxLength: 254
        shipping_method_name:
          type: string
          nullable: true
          readOnly: true
        voucher_code:
          type: string
          description: Código del voucher al momento del checkout.
          maxLength: 50
        voucher_discount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        notes:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          readOnly: true
        value:
          allOf:
          - $ref: '#/components/schemas/OrderValue'
          readOnly: true
        address:
          allOf:
          - $ref: '#/components/schemas/OrderAddress'
          readOnly: true
        status_logs:
          type: array
          items:
            $ref: '#/components/schemas/OrderStatusLog'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        cancelled_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp de la cancelación. Null si la orden no está cancelada.
        cancellation_reason:
          type: string
          description: Motivo de la cancelación (comprador o admin).
        user_email:
          type: string
          nullable: true
          readOnly: true
        user_username:
          type: string
          nullable: true
          readOnly: true
      required:
      - address
      - created_at
