      description: POST /api/v1/payments/initiate/ — UC-PAY-01 (MP) y UC-PAY-02 (PayPal).
      properties:
        order_number:
          type: string
          minLength: 1
          description: Número de orden a pagar (PY-XXXXXXXX).
          maxLength: 20
        gateway:
          allOf:
          - $ref: '#/components/schemas/PaymentGatewayChoiceEnum'
          default: MERCADOPAGO
          description: |-
            Gateway de pago. MERCADOPAGO (por defecto, BR-006) o PAYPAL (BR-007).

            * `MERCADOPAGO` - MercadoPago
            * `PAYPAL` - PayPal
        installments:
          type: integer
          minimum: 1
          default: 1
          description: Número de cuotas MSI. Solo aplica para MERCADOPAGO. 1 = contado.
      required:
      - order_number
    InitiatePaymentResponse:
      type: object
      description: |-
        Respuesta de POST /api/v1/payments/initiate/.

        payment_id is deprecated (always null).  Use order_number to poll
        /payments/<order_number>/status/ — RNF-SEC-001 forbids exposing
        sequential internal PKs.
      properties:
        payment_id:
          type: integer
          nullable: true
        checkout_url:
          type: string
          format: uri
          description: URL de la interfaz de pago del gateway. El frontend redirige
            al comprador aquí.
        order_number:
          type: string
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        installments:
          type: integer
      required:
      - amount
      - checkout_url
      - installments
      - order_number
