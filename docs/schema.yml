openapi: 3.0.3
info:
  title: PracticaYoruba API
  version: 1.0.0
  description: |-
    API REST de PracticaYoruba — plataforma e-commerce de productos Yoruba.

    Autenticación: JWT Bearer token via POST /api/v1/auth/login/
    Todos los endpoints bajo el prefijo /api/v1/
  contact:
    name: Equipo PracticaYoruba
    email: dev@practicayoruba.mx
  license:
    name: Propietario
paths:
  /api/v1/admin/audit-log/:
    get:
      operationId: admin_audit_log_retrieve
      description: |-
        UC-ADM-03: Feed paginado del audit log admin (read-only).
        Combina AuthEvent + BusinessEvent + UserDeactivationEvent.
        GET /api/v1/admin/audit-log/
        Filtros: ?event_type=auth|business|deactivation  ?user_id=<pk>
      summary: Listar audit log de eventos (UC-ADM-03)
      parameters:
      - in: query
        name: event_type
        schema:
          type: string
        description: auth | business | deactivation
      - in: query
        name: page
        schema:
          type: integer
        description: Número de página
      - in: query
        name: user_id
        schema:
          type: integer
        description: Filtrar por usuario
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/admin/backups/:
    get:
      operationId: admin_backups_list
      description: GET /api/v1/admin/backups/ — UC-ADM-05.
      summary: Listar historial de backups (UC-ADM-05)
      tags:
      - admin-backups
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BackupRecord'
          description: ''
  /api/v1/admin/backups/trigger/:
    post:
      operationId: admin_backups_trigger_create
      description: POST /api/v1/admin/backups/trigger/ — UC-ADM-05.
      summary: Disparar backup manual on-demand (UC-ADM-05)
      tags:
      - admin-backups
      security:
      - jwtAuth: []
      responses:
        '202':
          description: Backup encolado.
  /api/v1/admin/categories/:
    get:
      operationId: admin_categories_list
      summary: Listar categorías (admin)
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - admin-catalogue
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCategoryAdminList'
          description: ''
    post:
      operationId: admin_categories_create
      summary: Crear categoría
      tags:
      - admin-catalogue
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryAdminRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CategoryAdminRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CategoryAdminRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryAdmin'
          description: ''
  /api/v1/admin/categories/{id}/:
    get:
      operationId: admin_categories_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Categoría.
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryAdmin'
          description: ''
    patch:
      operationId: admin_categories_partial_update
      summary: Editar categoría
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Categoría.
        required: true
      tags:
      - admin-catalogue
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCategoryAdminRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCategoryAdminRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCategoryAdminRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryAdmin'
          description: ''
    delete:
      operationId: admin_categories_destroy
      summary: Desactivar categoría (soft delete)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Categoría.
        required: true
      tags:
      - admin-catalogue
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
        '400':
          description: No response body
  /api/v1/admin/categories/{id}/deactivate/:
    post:
      operationId: admin_categories_deactivate_create
      summary: Desactivar categoría por POST
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Categoría.
        required: true
      tags:
      - admin-catalogue
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryAdminRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CategoryAdminRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CategoryAdminRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryAdmin'
          description: ''
        '400':
          description: No response body
  /api/v1/admin/contact/messages/:
    get:
      operationId: admin_contact_messages_list
      description: GET /api/v1/admin/contact/ — UC-COM-02.
      summary: Listar mensajes de contacto (UC-COM-02)
      tags:
      - contact
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ContactMessageListItem'
          description: ''
  /api/v1/admin/contact/messages/{message_id}/:
    get:
      operationId: admin_contact_messages_retrieve
      description: GET /api/v1/admin/contact/<id>/ — UC-COM-03 detail.
      summary: Detalle de mensaje de contacto (UC-COM-03)
      parameters:
      - in: path
        name: message_id
        schema:
          type: integer
        required: true
      tags:
      - contact
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactMessageListItem'
          description: ''
        '404':
          description: No response body
  /api/v1/admin/contact/messages/{message_id}/read/:
    post:
      operationId: admin_contact_messages_read_create
      description: POST /api/v1/admin/contact/<id>/mark-read/ — UC-COM-03.
      summary: Marcar mensaje como leído (UC-COM-03)
      parameters:
      - in: path
        name: message_id
        schema:
          type: integer
        required: true
      tags:
      - contact
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactMessageListItem'
          description: ''
        '404':
          description: No response body
  /api/v1/admin/contact/messages/{message_id}/reply/:
    post:
      operationId: admin_contact_messages_reply_create
      description: POST /api/v1/admin/contact/<id>/reply/ — UC-COM-03 reply via email.
      summary: Responder mensaje de contacto por email (UC-COM-03)
      parameters:
      - in: path
        name: message_id
        schema:
          type: integer
        required: true
      tags:
      - contact
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactMessageListItem'
          description: ''
        '400':
          description: No response body
        '404':
          description: No response body
  /api/v1/admin/dashboard/:
    get:
      operationId: admin_dashboard_retrieve
      description: 'Retorna 4 bloques en una sola llamada: 1) contadores de órdenes
        por estado, 2) alertas de órdenes próximas a expirar (>80% del timeout), 3)
        resumen del día (pagos aprobados hoy), 4) últimas 10 órdenes.'
      summary: Dashboard transaccional (admin)
      tags:
      - orders-admin
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Dashboard con 4 bloques.
  /api/v1/admin/gateways/:
    get:
      operationId: admin_gateways_list
      description: |-
        GET    /api/v1/admin/gateways/       — listar gateways
        POST   /api/v1/admin/gateways/       — crear gateway
        GET    /api/v1/admin/gateways/<pk>/  — ver gateway (credenciales enmascaradas)
        PATCH  /api/v1/admin/gateways/<pk>/  — actualizar credenciales / activar-desactivar
        POST   /api/v1/admin/gateways/<pk>/verify/ — verificar conectividad

        UC-CFG-01 (FR-CFG-01.02).
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PaymentGateway'
          description: ''
    post:
      operationId: admin_gateways_create
      description: |-
        GET    /api/v1/admin/gateways/       — listar gateways
        POST   /api/v1/admin/gateways/       — crear gateway
        GET    /api/v1/admin/gateways/<pk>/  — ver gateway (credenciales enmascaradas)
        PATCH  /api/v1/admin/gateways/<pk>/  — actualizar credenciales / activar-desactivar
        POST   /api/v1/admin/gateways/<pk>/verify/ — verificar conectividad

        UC-CFG-01 (FR-CFG-01.02).
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentGatewayRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PaymentGatewayRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentGatewayRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentGateway'
          description: ''
  /api/v1/admin/gateways/{id}/:
    get:
      operationId: admin_gateways_retrieve
      description: |-
        GET    /api/v1/admin/gateways/       — listar gateways
        POST   /api/v1/admin/gateways/       — crear gateway
        GET    /api/v1/admin/gateways/<pk>/  — ver gateway (credenciales enmascaradas)
        PATCH  /api/v1/admin/gateways/<pk>/  — actualizar credenciales / activar-desactivar
        POST   /api/v1/admin/gateways/<pk>/verify/ — verificar conectividad

        UC-CFG-01 (FR-CFG-01.02).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Pasarela de pago.
        required: true
      tags:
      - admin
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentGateway'
          description: ''
    patch:
      operationId: admin_gateways_partial_update
      description: |-
        GET    /api/v1/admin/gateways/       — listar gateways
        POST   /api/v1/admin/gateways/       — crear gateway
        GET    /api/v1/admin/gateways/<pk>/  — ver gateway (credenciales enmascaradas)
        PATCH  /api/v1/admin/gateways/<pk>/  — actualizar credenciales / activar-desactivar
        POST   /api/v1/admin/gateways/<pk>/verify/ — verificar conectividad

        UC-CFG-01 (FR-CFG-01.02).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Pasarela de pago.
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedPaymentGatewayRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedPaymentGatewayRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedPaymentGatewayRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentGateway'
          description: ''
  /api/v1/admin/gateways/{id}/verify/:
    post:
      operationId: admin_gateways_verify_create
      description: |-
        GET    /api/v1/admin/gateways/       — listar gateways
        POST   /api/v1/admin/gateways/       — crear gateway
        GET    /api/v1/admin/gateways/<pk>/  — ver gateway (credenciales enmascaradas)
        PATCH  /api/v1/admin/gateways/<pk>/  — actualizar credenciales / activar-desactivar
        POST   /api/v1/admin/gateways/<pk>/verify/ — verificar conectividad

        UC-CFG-01 (FR-CFG-01.02).
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Pasarela de pago.
        required: true
      tags:
      - admin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentGatewayRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PaymentGatewayRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PaymentGatewayRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentGateway'
          description: ''
  /api/v1/admin/inventory/:
    get:
      operationId: admin_inventory_retrieve
      summary: Dashboard de inventario (UC-INV-01)
      tags:
      - inventory
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/admin/inventory/{product_pk}/adjust/:
    post:
      operationId: admin_inventory_adjust_create
      summary: Ajuste manual de stock de producto (UC-INV-04)
      parameters:
      - in: path
        name: product_pk
        schema:
          type: integer
        required: true
      tags:
      - inventory
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StockAdjustRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/StockAdjustRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/StockAdjustRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          description: No response body
        '400':
          description: No response body
        '404':
          description: No response body
  /api/v1/admin/inventory/alerts/:
    get:
      operationId: admin_inventory_alerts_list
      summary: Alertas de stock bajo (UC-INV-02)
      tags:
      - inventory
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockAlert'
          description: ''
  /api/v1/admin/inventory/alerts/{id}/resolve/:
    post:
      operationId: admin_inventory_alerts_resolve_create
      description: |-
        POST /api/v1/admin/inventory/alerts/<pk>/resolve/
        Marca una alerta de stock como resuelta.
        UC-INV-02 (accion de resolucion manual).

        H-CICLO104-03: select_for_update() + atomic() previene que dos admins
        resuelvan la misma alerta concurrentemente y guarden resolved_at
        diferente. La alerta se registra en StockMovement como pista de
        auditoria (type=TYPE_ADJUSTMENT con notes=ALERT_RESOLVED).
      summary: Resolver alerta de stock (UC-INV-02)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - inventory
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockAlert'
          description: ''
        '404':
          description: No response body
  /api/v1/admin/inventory/import/:
    post:
      operationId: admin_inventory_import_create
      summary: Importar productos desde CSV (UC-INV-05)
      tags:
      - inventory
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
        '400':
          description: No response body
        '422':
          description: No response body
  /api/v1/admin/inventory/import-reports/{report_id}.csv:
    get:
      operationId: admin_inventory_import_reports_.csv_retrieve
      summary: Descarga CSV de errores de importación
      parameters:
      - in: path
        name: report_id
        schema:
          type: string
        required: true
      tags:
      - inventory
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
        '404':
          description: No response body
  /api/v1/admin/inventory/import/{job_id}/:
    get:
      operationId: admin_inventory_import_retrieve
      summary: Estado de importación (UC-INV-05)
      parameters:
      - in: path
        name: job_id
        schema:
          type: string
        required: true
      tags:
      - inventory
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
        '404':
          description: No response body
  /api/v1/admin/inventory/variants/{variant_pk}/adjust/:
    post:
      operationId: admin_inventory_variants_adjust_create
      summary: Ajuste manual de stock de variante (UC-INV-04)
      parameters:
      - in: path
        name: variant_pk
        schema:
          type: integer
        required: true
      tags:
      - inventory
      security:
      - jwtAuth: []
      responses:
        '201':
          description: No response body
        '400':
          description: No response body
        '422':
          description: No response body
        '404':
          description: No response body
  /api/v1/admin/inventory/variants/{variant_pk}/movements/:
    get:
      operationId: admin_inventory_variants_movements_list
      summary: Historial de movimientos de stock (UC-INV-03)
      parameters:
      - in: path
        name: variant_pk
        schema:
          type: integer
        required: true
      tags:
      - inventory
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StockMovement'
          description: ''
  /api/v1/admin/newsletter/campaigns/:
    post:
      operationId: admin_newsletter_campaigns_create
      description: |-
        POST /api/v1/admin/newsletter/campaigns/ — UC-NEW-04.

        H-CICLO78-01: guarda de idempotencia contra doble envio.
        Un segundo POST identico (mismo subject + body + audience_filter)
        dentro de la ventana de deduplicacion (_CAMPAIGN_DEDUP_WINDOW)
        retorna 409 con error_code CAMPAIGN_ALREADY_SENT en lugar de crear
        una segunda campana y enviar los emails de nuevo.
        La comprobacion se hace dentro de transaction.atomic() con
        select_for_update() para evitar la race condition en envios
        concurrentes desde distintos procesos WSGI.
      summary: Crear campaña de newsletter (UC-NEW-04)
      tags:
      - newsletter
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CampaignCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CampaignCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignResponse'
          description: ''
        '400':
          description: No response body
        '409':
          description: No response body
  /api/v1/admin/newsletter/subscribers/:
    get:
      operationId: admin_newsletter_subscribers_list
      description: GET /api/v1/admin/newsletter/subscribers/ — UC-NEW-03.
      summary: Listar suscriptores (UC-NEW-03)
      tags:
      - newsletter
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubscriberListItem'
          description: ''
  /api/v1/admin/newsletter/subscribers/{subscriber_id}/unsubscribe/:
    post:
      operationId: admin_newsletter_subscribers_unsubscribe_create
      description: POST /api/v1/admin/newsletter/subscribers/<id>/unsubscribe/ — UC-NEW-03.
      summary: Dar de baja suscriptor (admin) (UC-NEW-03)
      parameters:
      - in: path
        name: subscriber_id
        schema:
          type: integer
        required: true
      tags:
      - newsletter
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
        '404':
          description: No response body
  /api/v1/admin/notifications/audience-count/:
    get:
      operationId: admin_notifications_audience_count_retrieve
      description: GET /api/v1/admin/notifications/audience-count/.
      summary: Tamano de la audiencia destino
      parameters:
      - in: query
        name: product_id
        schema:
          type: integer
      - in: query
        name: recipient_identifier
        schema:
          type: string
      - in: query
        name: recipient_type
        schema:
          type: string
        required: true
      tags:
      - notifications
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudienceCountResponse'
          description: ''
  /api/v1/admin/notifications/manual/:
    post:
      operationId: admin_notifications_manual_create
      description: POST /api/v1/admin/notifications/manual/.
      summary: Enviar notificacion manual
      tags:
      - notifications
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualNotificationCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ManualNotificationCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ManualNotificationCreateRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualNotificationResponse'
          description: ''
  /api/v1/admin/orders/:
    get:
      operationId: admin_orders_list
      description: Listado de todas las órdenes del sistema. Filtros acumulativos
        (AND). Paginado a 20 por página. Solo administradores.
      summary: Listar y filtrar órdenes (admin)
      parameters:
      - in: query
        name: date_from
        schema:
          type: string
        description: Fecha desde (YYYY-MM-DD)
      - in: query
        name: date_to
        schema:
          type: string
        description: Fecha hasta (YYYY-MM-DD)
      - in: query
        name: email
        schema:
          type: string
        description: Email del usuario o guest_email
      - in: query
        name: order_number
